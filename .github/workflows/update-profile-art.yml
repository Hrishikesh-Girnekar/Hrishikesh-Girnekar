name: Update GitHub Profile

on:
  schedule:
    - cron: "17 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh GitHub language data
        run: python scripts/make_languages.py

      - name: Create daily profile heartbeat
        run: |
          echo "Profile refreshed: $(date -u '+%Y-%m-%d')" > data/daily-refresh.txt

      - name: Commit daily profile update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily profile refresh"
          file_pattern: "languages.svg data/daily-refresh.txt"