<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="360"
    viewBox="0 0 1000 360">

    <rect
        width="100%"
        height="100%"
        rx="20"
        fill="#0d1117"
        stroke="#30363d"
        stroke-width="2"/>

    <style>

        .fade {
            opacity: 0;
            animation: reveal 0.6s ease-out forwards;
        }

        .label {
            font-family: monospace;
            font-size: 13px;
            fill: #58a6ff;
            font-weight: bold;
        }

        .heading {
            font-family: monospace;
            font-size: 24px;
            fill: #f0f6fc;
            font-weight: bold;
        }

        .period {
            font-family: monospace;
            font-size: 11px;
            fill: #3fb950;
            font-weight: bold;
        }

        .role {
            font-family: monospace;
            font-size: 16px;
            fill: #f0f6fc;
            font-weight: bold;
        }

        .company {
            font-family: monospace;
            font-size: 12px;
            fill: #8b949e;
        }

        .work {
            font-family: monospace;
            font-size: 12px;
            fill: #f0f6fc;
        }

        .line {
            stroke: #30363d;
            stroke-width: 2;
        }

        .dot {
            fill: #3fb950;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>


    <text
        x="42"
        y="42"
        class="label fade"
        style="animation-delay: 0.1s">

        04 / EXPERIENCE

    </text>

    <text
        x="42"
        y="82"
        class="heading fade"
        style="animation-delay: 0.2s">

        Where I've worked

    </text>

    <!-- Timeline -->

    <line
        x1="72"
        y1="120"
        x2="72"
        y2="315"
        class="line"/>


    <g
        class="fade"
        style="animation-delay: 0.40s">

        <circle
            cx="72"
            cy="130"
            r="6"
            class="dot"/>

        <text
            x="100"
            y="122"
            class="period">

            DEC 2025 — MAY 2026

        </text>

        <text
            x="100"
            y="147"
            class="role">

            Associate Software Engineer Intern

        </text>

        <text
            x="100"
            y="169"
            class="company">

            Thynktech India Pvt. Ltd.

        </text>

        <text
            x="100"
            y="191"
            class="work">

            Java 17  •  Spring Boot  •  REST APIs  •  Microservices

        </text>

    </g>
    
    <g
        class="fade"
        style="animation-delay: 0.60s">

        <circle
            cx="72"
            cy="225"
            r="6"
            class="dot"/>

        <text
            x="100"
            y="217"
            class="period">

            PREVIOUS EXPERIENCE

        </text>

        <text
            x="100"
            y="242"
            class="role">

            IT / Software Engineering

        </text>

        <text
            x="100"
            y="264"
            class="company">

            Technical &amp; software development experience

        </text>

        <text
            x="100"
            y="286"
            class="work">

            Backend development  •  Full-stack applications  •  Problem solving

        </text>

    </g>
    
</svg>
