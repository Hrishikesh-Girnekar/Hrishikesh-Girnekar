<svg xmlns="http://www.w3.org/2000/svg"
    width="800"
    height="594"
    viewBox="0 0 800 594">

    <rect
        width="100%"
        height="100%"
        fill="white"/>

    <style>
        .ascii-row {
            opacity: 0;
            animation: typeRow
                0.08s
                ease-out
                forwards;
        }

        @keyframes typeRow {
            from {
                opacity: 0;
                transform: translateX(-8px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>

