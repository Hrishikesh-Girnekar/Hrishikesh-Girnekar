<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="430"
    viewBox="0 0 1000 430">

    <rect
        width="100%"
        height="100%"
        rx="20"
        fill="#0d1117"
        stroke="#30363d"
        stroke-width="2"/>

    <style>

        .fade {
            opacity: 0;
            animation: reveal 0.55s ease-out forwards;
        }

        .label {
            font-family: monospace;
            font-size: 13px;
            fill: #58a6ff;
            font-weight: bold;
        }

        .heading {
            font-family: monospace;
            font-size: 24px;
            fill: #f0f6fc;
            font-weight: bold;
        }

        .name {
            font-family: monospace;
            font-size: 14px;
            fill: #f0f6fc;
            font-weight: bold;
        }

        .percentage {
            font-family: monospace;
            font-size: 12px;
            fill: #8b949e;
        }

        .bar-background {
            fill: #161b22;
        }

        .bar {
            fill: #3fb950;
        }

        .line {
            stroke: #30363d;
            stroke-width: 1;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

    </style>


    <text
        x="42"
        y="42"
        class="label fade"
        style="animation-delay: 0.1s">

        06 / LANGUAGES

    </text>


    <text
        x="42"
        y="82"
        class="heading fade"
        style="animation-delay: 0.2s">

        Languages I've worked with

    </text>

    <g
        class="fade"
        style="animation-delay: 0.35s">

        <text
            x="52"
            y="135"
            class="name">

            JavaScript

        </text>


        <rect
            x="230"
            y="125"
            width="500"
            height="12"
            rx="6"
            class="bar-background"/>


        <rect
            x="230"
            y="125"
            width="382.2"
            height="12"
            rx="6"
            class="bar"/>


        <text
            x="755"
            y="135"
            class="percentage">

            76.4%

        </text>

    </g>
    
    <g
        class="fade"
        style="animation-delay: 0.43s">

        <text
            x="52"
            y="173"
            class="name">

            Java

        </text>


        <rect
            x="230"
            y="163"
            width="500"
            height="12"
            rx="6"
            class="bar-background"/>


        <rect
            x="230"
            y="163"
            width="69.2"
            height="12"
            rx="6"
            class="bar"/>


        <text
            x="755"
            y="173"
            class="percentage">

            13.8%

        </text>

    </g>
    
    <g
        class="fade"
        style="animation-delay: 0.51s">

        <text
            x="52"
            y="211"
            class="name">

            Python

        </text>


        <rect
            x="230"
            y="201"
            width="500"
            height="12"
            rx="6"
            class="bar-background"/>


        <rect
            x="230"
            y="201"
            width="20.7"
            height="12"
            rx="6"
            class="bar"/>


        <text
            x="755"
            y="211"
            class="percentage">

            4.1%

        </text>

    </g>
    
    <g
        class="fade"
        style="animation-delay: 0.59s">

        <text
            x="52"
            y="249"
            class="name">

            CSS

        </text>


        <rect
            x="230"
            y="239"
            width="500"
            height="12"
            rx="6"
            class="bar-background"/>


        <rect
            x="230"
            y="239"
            width="17.7"
            height="12"
            rx="6"
            class="bar"/>


        <text
            x="755"
            y="249"
            class="percentage">

            3.5%

        </text>

    </g>
    
    <g
        class="fade"
        style="animation-delay: 0.67s">

        <text
            x="52"
            y="287"
            class="name">

            EJS

        </text>


        <rect
            x="230"
            y="277"
            width="500"
            height="12"
            rx="6"
            class="bar-background"/>


        <rect
            x="230"
            y="277"
            width="8.8"
            height="12"
            rx="6"
            class="bar"/>


        <text
            x="755"
            y="287"
            class="percentage">

            1.8%

        </text>

    </g>
    
    <g
        class="fade"
        style="animation-delay: 0.75s">

        <text
            x="52"
            y="325"
            class="name">

            HTML

        </text>


        <rect
            x="230"
            y="315"
            width="500"
            height="12"
            rx="6"
            class="bar-background"/>


        <rect
            x="230"
            y="315"
            width="1.2"
            height="12"
            rx="6"
            class="bar"/>


        <text
            x="755"
            y="325"
            class="percentage">

            0.2%

        </text>

    </g>
    
    <line
        x1="42"
        y1="425"
        x2="958"
        y2="425"
        class="line"/>

</svg>
