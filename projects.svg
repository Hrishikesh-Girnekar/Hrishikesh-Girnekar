<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="610"
    viewBox="0 0 1000 610">

    <rect
        width="100%"
        height="100%"
        rx="20"
        fill="#0d1117"
        stroke="#30363d"
        stroke-width="2"/>

    <style>

        .fade {
            opacity: 0;
            animation: reveal 0.6s ease-out forwards;
        }

        .label {
            font-family: monospace;
            font-size: 13px;
            fill: #58a6ff;
            font-weight: bold;
        }

        .heading {
            font-family: monospace;
            font-size: 24px;
            fill: #f0f6fc;
            font-weight: bold;
        }

        .project-number {
            font-family: monospace;
            font-size: 12px;
            fill: #58a6ff;
            font-weight: bold;
        }

        .project-name {
            font-family: monospace;
            font-size: 17px;
            fill: #f0f6fc;
            font-weight: bold;
        }

        .description {
            font-family: monospace;
            font-size: 12px;
            fill: #8b949e;
        }

        .stack {
            font-family: monospace;
            font-size: 12px;
            fill: #f0f6fc;
        }

        .type {
            font-family: monospace;
            font-size: 11px;
            fill: #3fb950;
        }

        .line {
            stroke: #30363d;
            stroke-width: 1;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>


    <!-- Section heading -->

    <text
        x="42"
        y="42"
        class="label fade"
        style="animation-delay: 0.1s">

        03 / PROJECTS

    </text>

    <text
        x="42"
        y="82"
        class="heading fade"
        style="animation-delay: 0.2s">

        Things I've built

    </text>

    <g
        class="fade"
        style="animation-delay: 0.35s">

        <!-- Card -->

        <rect
            x="42"
            y="115"
            width="916"
            height="135"
            rx="12"
            fill="#161b22"
            stroke="#30363d"
            stroke-width="1"/>


        <!-- Project number -->

        <text
            x="62"
            y="142"
            class="project-number">

            01

        </text>


        <!-- Project name -->

        <text
            x="105"
            y="142"
            class="project-name">

            Fisheries Management Platform

        </text>


        <!-- Project type -->

        <text
            x="925"
            y="141"
            text-anchor="end"
            class="type">

            Enterprise / Microservices

        </text>


        <!-- Description -->

        <text
            x="62"
            y="173"
            class="description">

            A scalable platform for managing fisheries operations, boats, fishermen, traders and buyers.

        </text>


        <!-- Stack -->

        <text
            x="62"
            y="206"
