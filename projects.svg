            Java  •  Spring Boot  •  React  •  PostgreSQL

        </text>


        <!-- Project command -->

        <text
            x="62"
            y="232"
            class="description">

            $ project.status → completed / evolving

        </text>

    </g>
    
    <g
        class="fade"
        style="animation-delay: 0.55s">

        <!-- Card -->

        <rect
            x="42"
            y="275"
            width="916"
            height="135"
            rx="12"
            fill="#161b22"
            stroke="#30363d"
            stroke-width="1"/>


        <!-- Project number -->

        <text
            x="62"
            y="302"
            class="project-number">

