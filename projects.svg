        </text>


        <!-- Description -->

        <text
            x="62"
            y="493"
            class="description">

            An Airbnb-style platform for discovering, listing and managing travel properties.

        </text>


        <!-- Stack -->

        <text
            x="62"
            y="526"
            class="stack">

            React  •  Node.js  •  Express  •  MongoDB

        </text>


        <!-- Project command -->

        <text
            x="62"
            y="552"
            class="description">

            $ project.status → completed / evolving

        </text>

    </g>
    
</svg>
