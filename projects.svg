            FoodDash

        </text>


        <!-- Project type -->

        <text
            x="925"
            y="301"
            text-anchor="end"
            class="type">

            Full Stack Application

        </text>


        <!-- Description -->

        <text
            x="62"
            y="333"
            class="description">

            A full-stack food delivery application with authentication, restaurants, orders and payments.

        </text>


        <!-- Stack -->

        <text
            x="62"
            y="366"
            class="stack">

            React  •  Node.js  •  Express  •  MongoDB

        </text>


        <!-- Project command -->

        <text
            x="62"
            y="392"
            class="description">

            $ project.status → completed / evolving

        </text>

    </g>
    
    <g
        class="fade"
        style="animation-delay: 0.75s">

        <!-- Card -->

        <rect
            x="42"
            y="435"
            width="916"
            height="135"
            rx="12"
            fill="#161b22"
            stroke="#30363d"
            stroke-width="1"/>


        <!-- Project number -->

        <text
            x="62"
            y="462"
            class="project-number">

            03

        </text>


        <!-- Project name -->

        <text
            x="105"
            y="462"
            class="project-name">

            Wanderlust

        </text>


        <!-- Project type -->

        <text
            x="925"
            y="461"
            text-anchor="end"
            class="type">

